<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Play</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0b0e11; color: white; padding: 10px; padding-bottom: 90px; }
        .match-card { background: #1c1f26; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 1px solid #333; }
        .banner { width: 100%; height: 160px; object-fit: cover; }
        .content { padding: 15px; }
        .slot-bar { background: #333; height: 6px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .slot-fill { background: #00ff88; height: 100%; transition: 0.5s; }
        .join-btn { width: 100%; background: #0A84FF; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; }
        
        #pay-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.96); padding:20px; box-sizing:border-box; z-index: 1000; overflow-y: auto; }
        .qr-img { width: 220px; height: 220px; background: white; padding: 10px; border-radius: 10px; margin: 15px auto; display: block; }
        
        .ad-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #1c1f26; border-top: 2px solid #0A84FF; z-index: 100; display: none; }
    </style>
</head>
<body>

    <h2 style="margin-left:5px;">🔥 Current Matches</h2>
    <div id="match-list">Loading...</div>

    <div id="ad-banner" class="ad-footer">
        <a id="ad-link" href="#" target="_blank" style="display:flex; align-items:center; padding:10px; text-decoration:none; color:white;">
            <img id="ad-img" src="" style="width:40px; height:40px; border-radius:5px; margin-right:10px;">
            <div style="font-size:12px;"><b>Sponsor</b><br>Click to visit.</div>
        </a>
    </div>

    <div id="pay-modal">
        <div style="background:#1c1f26; padding:20px; border-radius:15px; text-align:center; max-width:400px; margin:auto;">
            <h3>Scan & Join</h3>
            <img id="display-qr" src="" class="qr-img">
            <p style="font-size:14px;">UPI: <b id="display-upi" style="color:#00ff88;">...</b></p>
            <input type="text" id="txn-id" placeholder="Enter Transaction ID (12 Digits)" style="width:100%; padding:12px; margin-top:10px; border-radius:8px; background:#0b0e11; color:white; border:1px solid #333;">
            <button onclick="submitJoin()" style="width:100%; background:#00ff88; color:#000; padding:12px; border:none; border-radius:8px; font-weight:bold; margin-top:15px;">DONE - SEND REQUEST</button>
            <button onclick="document.getElementById('pay-modal').style.display='none'" style="width:100%; background:none; color:gray; border:none; margin-top:10px;">Cancel</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, increment, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      
      authDomain: "free-fire-tunamant-b36b4.firebaseapp.com",
      databaseURL: "https://free-fire-tunamant-b36b4-default-rtdb.firebaseio.com",
      projectId: "free-fire-tunamant-b36b4",
      storageBucket: "free-fire-tunamant-b36b4.firebasestorage.app",
      messagingSenderId: "554016962343",
      appId: "1:554016962343:web:2dd22dafff940772f4db02"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let curId = ""; 

    // Load Settings
    onSnapshot(doc(db, "settings", "payment"), d => {
        if(d.exists()) {
            document.getElementById('display-qr').src = d.data().qrUrl;
            document.getElementById('display-upi').innerText = d.data().upiId;
        }
    });

    onSnapshot(query(collection(db, "tournaments"), orderBy("createdAt", "desc")), s => {
        const list = document.getElementById('match-list'); list.innerHTML = "";
        s.forEach(d => {
            const t = d.data(); const id = d.id;
            const prog = (t.joined / 48) * 100;
            list.innerHTML += `<div class="match-card">
                <img src="${t.banner}" class="banner">
                <div class="content">
                    <div style="display:flex; justify-content:space-between;"><h3>${t.title}</h3> <span style="color:#00ff88;">₹${t.prize}</span></div>
                    <div class="slot-bar"><div class="slot-fill" style="width:${prog}%"></div></div>
                    <div style="font-size:12px; margin-bottom:10px;">Players Joined: ${t.joined}/48</div>
                    ${t.roomId ? `<div style="background:#00ff8822; padding:10px; color:#00ff88; border-radius:8px; margin-bottom:10px; text-align:center; font-size:14px;">Room ID: ${t.roomId}</div>` : ''}
                    <button class="join-btn" onclick="openM('${id}')" ${t.joined>=48?'disabled':''}>${t.joined>=48?'MATCH FULL':'JOIN NOW (₹'+t.fee+')'}</button>
                </div>
            </div>`;
        });
    });

    onSnapshot(doc(db, "ads", "current"), d => {
        if(d.exists()){
            const ad = d.data(); document.getElementById('ad-banner').style.display='block';
            document.getElementById('ad-img').src=ad.imageUrl; document.getElementById('ad-link').href=ad.linkUrl;
        }
    });

    window.openM = (id) => { curId = id; document.getElementById('pay-modal').style.display='block'; };

    window.submitJoin = async () => {
        const txn = document.getElementById('txn-id').value;
        if(txn.length < 6) return alert("Wrong Transaction ID!");
        await addDoc(collection(db, "payments"), { userName: "User_"+Math.floor(1000+Math.random()*9000), txnId: txn, matchId: curId, status: "pending" });
        await updateDoc(doc(db, "tournaments", curId), { joined: increment(1) });
        alert("Success! Admin will verify soon."); document.getElementById('pay-modal').style.display='none';
    };
</script>
</body>
</html>
